<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Attendance — Sweet Science Systems</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--red:#E8372A;--dark:#0d0d0b;--dark2:#141412;--dark3:#1c1c19;--dark4:#222220;--gold:#c9a84c;--text:#e8e4dc;--muted:#7a7670;--border:rgba(255,255,255,0.07);--green:#639922;}
body{background:var(--dark);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;}

nav{display:flex;align-items:center;justify-content:space-between;padding:16px 48px;background:var(--dark2);border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--text);text-decoration:none;letter-spacing:1px;}
.nav-logo span{color:var(--red);}
.nav-links{display:flex;gap:6px;}
.nav-pill{padding:7px 16px;border-radius:2px;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;text-decoration:none;color:var(--muted);transition:all 0.2s;}
.nav-pill:hover{color:var(--text);background:rgba(255,255,255,0.04);}
.nav-pill.active{color:#fff;background:var(--red);}
.nav-back{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;text-decoration:none;transition:color 0.2s;}
.nav-back:hover{color:var(--text);}

.main{max-width:1000px;margin:0 auto;padding:48px 24px;}
.page-tag{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--red);margin-bottom:6px;}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:52px;color:#fff;letter-spacing:1px;line-height:1;margin-bottom:4px;}
.page-sub{font-size:14px;color:var(--muted);margin-bottom:32px;}

.card{background:var(--dark3);border:1px solid var(--border);border-radius:4px;padding:32px;}
.card-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:24px;display:block;}

/* ATTENDANCE LIST */
.attendance-list{display:flex;flex-direction:column;gap:2px;}
.att-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;padding:16px 24px;background:var(--dark2);border-radius:2px;transition:background 0.2s;}
.att-row:hover{background:rgba(255,255,255,0.02);}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.att-info{display:flex;flex-direction:column;gap:2px;}
.att-name{font-size:15px;font-weight:600;color:#fff;}
.att-meta{font-size:12px;color:var(--muted);}

.att-toggles{display:flex;gap:4px;}
.att-btn{padding:8px 16px;border-radius:2px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all 0.2s;font-family:'Barlow',sans-serif;}
.att-btn.present-active{background:rgba(99,153,34,0.15);border-color:rgba(99,153,34,0.3);color:#8bc34a;}
.att-btn.absent-active{background:rgba(232,55,42,0.1);border-color:rgba(232,55,42,0.25);color:#ff6b5e;}

.btn-submit{width:100%;padding:16px;background:var(--red);color:#fff;border:none;border-radius:3px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Barlow',sans-serif;transition:background 0.2s;letter-spacing:1px;text-transform:uppercase;margin-top:32px;}
.btn-submit:hover{background:#ff4e3f;}
.btn-submit:disabled{background:var(--muted);opacity:0.5;cursor:not-allowed;}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:3px;font-size:13px;font-weight:600;z-index:200;transform:translateY(80px);opacity:0;transition:all 0.3s;}
.toast.show{transform:translateY(0);opacity:1;}
.toast-success{background:var(--green);color:#fff;}
.toast-error{background:var(--red);color:#fff;}
</style>
</head>
<body>

<nav>
  <a href="dashboard.html" class="nav-back">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Dashboard
  </a>
  <div class="nav-links">
    <a href="dashboard.html" class="nav-pill">Dashboard</a>
    <a href="fighter-profile.html" class="nav-pill">Fighter Profile</a>
    <a href="attendance.html" class="nav-pill active">Attendance</a>
    <a href="ai-coach.html" class="nav-pill">AI Coach + Goals</a>
    <a href="performance.html" class="nav-pill">Performance</a>
    <a href="report.html" class="nav-pill">Reports</a>
  </div>
  <a href="dashboard.html" class="nav-logo">Sweet <span>Science</span></a>
</nav>

<div class="main">
  <div class="page-tag">Daily Operations</div>
  <div class="page-title">Gym Roll Call</div>
  <div class="page-sub">Mark daily attendance for all fighters. System resets visually every 24 hours. Today is <span id="today-display" style="color:#fff;font-weight:600;"></span></div>

  <div class="card">
    <span class="card-label">Active Roster Checklist</span>
    <div id="attendance-list" class="attendance-list">
      <div style="padding:40px;text-align:center;color:var(--muted);">Loading roster...</div>
    </div>
    <button class="btn-submit" id="save-btn" onclick="saveAttendance()">Save Today's Attendance</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API   = '/api';
const token = localStorage.getItem('sss_token');
if (!token) window.location.href = 'login.html';

let fighters = [];
let todayRecords = {}; // fighter_id -> attended (boolean)

function authFetch(url, opts={}) {
  return fetch(API + url, {
    ...opts,
    headers:{ 'Content-Type':'application/json','Authorization':'Bearer '+token,...(opts.headers||{}) }
  });
}

const todayStr = new Date().toISOString().split('T')[0];
document.getElementById('today-display').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

window.addEventListener('DOMContentLoaded', async () => {
  await Promise.all([loadFighters(), loadTodayAttendance()]);
  renderChecklist();
});

async function loadFighters() {
  const res = await authFetch('/fighters');
  if (res.status === 401) { logout(); return; }
  fighters = await res.json();
}

async function loadTodayAttendance() {
  const res = await authFetch('/attendance/today');
  const records = await res.json();
  records.forEach(r => {
    todayRecords[r.fighter_id] = r.attended;
  });
}

function avatarColors(name) {
  const colors=[['#3C3489','#AFA9EC'],['#185FA5','#85B7EB'],['#854F0B','#FAC775'],['#993C1D','#F0997B'],['#1A6B45','#7EC8A4']];
  return colors[(name||'').charCodeAt(0)%colors.length];
}
function initials(n){ return (n||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

function toggleAttendance(id, attended) {
  todayRecords[id] = attended;
  renderChecklist();
}

function renderChecklist() {
  const list = document.getElementById('attendance-list');
  if (!fighters.length) {
    list.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted);">No fighters found in roster.</div>';
    return;
  }

  list.innerHTML = fighters.map(f => {
    const [bg, fc] = avatarColors(f.name);
    const status = todayRecords[f.id]; // undefined, true, or false
    
    return `
      <div class="att-row">
        <div class="avatar" style="background:${bg};color:${fc};">${initials(f.name)}</div>
        <div class="att-info">
          <div class="att-name">${f.name}</div>
          <div class="att-meta">${f.weight_class || 'Unknown'} · Discipline: ${f.discipline_score || 0}%</div>
        </div>
        <div class="att-toggles">
          <button class="att-btn ${status === true ? 'present-active' : ''}" onclick="toggleAttendance('${f.id}', true)">Present</button>
          <button class="att-btn ${status === false ? 'absent-active' : ''}" onclick="toggleAttendance('${f.id}', false)">Absent</button>
        </div>
      </div>
    `;
  }).join('');
}

async function saveAttendance() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  const records = Object.keys(todayRecords).map(id => ({
    fighter_id: id,
    attended: todayRecords[id]
  }));

  try {
    const res = await authFetch('/attendance/batch', {
      method: 'POST',
      body: JSON.stringify({ records })
    });

    if (res.ok) {
      showToast('Attendance saved for today!', 'success');
    } else {
      showToast('Failed to save attendance', 'error');
    }
  } catch (error) {
    showToast('Server error', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = "Save Today's Attendance";
  }
}

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = `toast toast-${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

function logout() {
  localStorage.removeItem('sss_token');
  window.location.href = 'login.html';
}
</script>
</body>
</html>
